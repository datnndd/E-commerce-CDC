services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "${EC2_PRIVATE_IP:?Set EC2_PRIVATE_IP}:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://${EC2_PRIVATE_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${CDC_KAFKA_CLUSTER_ID:?Set a stable Kafka cluster ID}
    volumes:
      - ${CDC_DATA_DIR:?Set CDC_DATA_DIR}/kafka:/var/lib/kafka/data
    restart: unless-stopped

  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    depends_on: [kafka]
    ports:
      - "${EC2_PRIVATE_IP}:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: ecommerce-cdc-connect
      CONFIG_STORAGE_TOPIC: ecommerce-cdc-connect-config
      OFFSET_STORAGE_TOPIC: ecommerce-cdc-connect-offset
      STATUS_STORAGE_TOPIC: ecommerce-cdc-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
    volumes:
      - ${CDC_SECRET_DIR:?Set CDC_SECRET_DIR}:/run/secrets:ro
    restart: unless-stopped

  cdc-sink:
    build:
      context: .
      dockerfile: docker/cdc_sink.Dockerfile
    depends_on: [kafka]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      S3_BUCKET: ${S3_BUCKET:?Set the isolated project bucket}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      PIPELINE_S3_PREFIX: ${PIPELINE_S3_PREFIX:-}
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecommerce_cdc}
      CDC_SINK_GROUP: ${CDC_SINK_GROUP:-ecommerce-cdc-bronze-v1}
    restart: unless-stopped
