name: ecommerce_cdc
version: '1.0.0'
config-version: 2
profile: ecommerce_databricks

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ecommerce_cdc:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +file_format: delta
        +schema: gold

snapshots:
  ecommerce_cdc:
    +schema: snapshots
