[project]
name = "ecommerce-cdc-lakehouse"
version = "0.1.0"
description = "Local tooling for an e-commerce CDC lakehouse demo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.17,<2",
    "dbt-databricks>=1.10,<1.12",
    "faker>=37,<39",
    "psycopg[binary]>=3.2,<4",
    "pyspark>=4.0,<5",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.0,<2.1",
    "tzdata>=2025",
]

[tool.uv]
package = false
