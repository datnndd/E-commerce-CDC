services:
  postgres:
    image: postgres:18.6
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: ecommerce-airflow-local:stage6
    command: standalone
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__DAGS_FOLDER: /workspace/airflow/dags
      POSTGRES_HOST: ${AIRFLOW_POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${AIRFLOW_POSTGRES_PORT:-${POSTGRES_PORT:-5432}}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-${POSTGRES_DB:-ecommerce}}
      S3_BUCKET: ${AIRFLOW_S3_BUCKET:-${S3_BUCKET:-}}
      AIRFLOW_S3_BUCKET: ${AIRFLOW_S3_BUCKET:-}
      PIPELINE_S3_PREFIX: ${PIPELINE_S3_PREFIX:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${AWS_REGION:-ap-southeast-1}}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      GLUE_SILVER_JOB_NAME: ${GLUE_SILVER_JOB_NAME:-ecommerce-silver-transform}
      CDC_MODE: ${CDC_MODE:-polling}
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecommerce_cdc}
      CDC_CONNECTOR_NAME: ${CDC_CONNECTOR_NAME:-ecommerce-postgres-cdc}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_CONNECT_URL: ${KAFKA_CONNECT_URL:-http://connect:8083}
      GLUE_ROLE_ARN: ${GLUE_ROLE_ARN:-}
      SILVER_S3_ROOT: ${SILVER_S3_ROOT:-}
      DBT_SILVER_SCHEMA: ${DBT_SILVER_SCHEMA:-}
      DBT_TARGET_SCHEMA: ${DBT_TARGET_SCHEMA:-}
      DBT_S3_LOCATION: ${DBT_S3_LOCATION:-}
      BI_DATABASE: ${BI_DATABASE:-}
      ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-}
      ATHENA_RESULTS_S3: ${ATHENA_RESULTS_S3:-}
      AIRFLOW_CONN_AWS_DEFAULT: '{"conn_type":"aws","extra":{"region_name":"${AWS_REGION:-ap-southeast-1}"}}'
      AIRFLOW_ALERT_WEBHOOK_URL: ${AIRFLOW_ALERT_WEBHOOK_URL:-}
      EXCHANGE_BASE_CURRENCY: ${EXCHANGE_BASE_CURRENCY:-BRL}
      EXCHANGE_QUOTE_CURRENCIES: ${EXCHANGE_QUOTE_CURRENCIES:-USD}
      UV_PROJECT_ENVIRONMENT: /opt/project-venv
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow_data:/opt/airflow
      - ./:/workspace

  kafka:
    profiles: ["cdc"]
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data

  cdc-postgres:
    profiles: ["cdc"]
    image: postgres:18.6
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ecommerce_cdc_1c_test
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_cdc_data:/var/lib/postgresql

  connect:
    profiles: ["cdc"]
    image: quay.io/debezium/connect:3.7.1.Final
    depends_on: [kafka]
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: ecommerce-cdc-connect
      CONFIG_STORAGE_TOPIC: ecommerce-cdc-connect-config
      OFFSET_STORAGE_TOPIC: ecommerce-cdc-connect-offset
      STATUS_STORAGE_TOPIC: ecommerce-cdc-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
    volumes:
      - ./logs/cdc-secrets:/run/secrets:ro

  localstack:
    profiles: ["cdc"]
    image: localstack/localstack:2026.05.0
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_cdc_data:/var/lib/localstack

  cdc-sink:
    profiles: ["cdc"]
    build:
      context: .
      dockerfile: docker/cdc_sink.Dockerfile
    depends_on: [kafka, localstack]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: localcdc
      AWS_SECRET_ACCESS_KEY: localcdcpassword
      AWS_REGION: us-east-1
      S3_BUCKET: ecommerce-cdc-local
      PIPELINE_S3_PREFIX: stage9_local
      CDC_LOCAL_CREATE_BUCKET: "true"
    restart: unless-stopped

volumes:
  postgres18_data:
  airflow_data:
  kafka_data:
  localstack_cdc_data:
  postgres_cdc_data:
